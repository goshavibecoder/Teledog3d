<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071326"><meta name="description" content="TELEDOG AND FRIEND’S — интерактивная 3D-комната в Telegram.">
<title>TELEDOG AND FRIEND’S</title>
<link rel="stylesheet" href="./style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="./vendor/model-viewer.min.js"></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<header><div class="brand"><span class="spark" aria-hidden="true">✦</span><div><strong>TELEDOG</strong><span>AND FRIEND’S</span></div></div><span class="badge">3D ROOM</span></header>
<main>
<model-viewer id="room" src="./assets/room.glb" alt="Комната Teledog с витриной игрушек, диваном и компьютером с синей голограммой" camera-controls touch-action="none" autoplay animation-name="Animation" camera-orbit="38deg 62deg auto" field-of-view="38deg" min-camera-orbit="auto 12deg 1.8m" max-camera-orbit="auto 88deg 14m" min-field-of-view="15deg" max-field-of-view="60deg" environment-image="neutral" exposure="1" shadow-intensity="0.35" shadow-softness="0.9" interaction-prompt="none" loading="eager" reveal="auto">
 <div slot="progress-bar" class="loading" id="loading" role="status" aria-live="polite"><div class="loader-card"><span class="orb"></span><h1>Твоя комната Teledog</h1><p id="loading-label">Загружаем 3D-комнату…</p><div class="track"><div id="progress"></div></div><small>Первая загрузка может занять немного времени</small></div></div>
</model-viewer>
<div class="hint" id="hint">Вращай пальцем · Приближай двумя пальцами</div>
<section class="error" id="error" hidden><h2>Комната не загрузилась</h2><p>Проверь соединение и попробуй ещё раз.</p><button id="retry">Повторить</button></section>
</main>
<footer><div class="controls"><button id="reset" disabled><span aria-hidden="true">↺</span> Вид</button><button id="rotate" aria-pressed="false" disabled><span aria-hidden="true">⟳</span> Облёт</button><button id="animation" aria-pressed="true" disabled><span aria-hidden="true">✦</span> Голограмма</button></div><p>Исследуй нашу маленькую вселенную</p></footer>
</body></html>
